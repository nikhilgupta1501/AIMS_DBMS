# Render Blueprint Infrastructure-as-Code for AIMS (Autonomous Inventory Management System)
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: aims-inventory
    runtime: node
    # Starter plan or higher is required on Render to attach persistent disks.
    # Persistent disks are not available on the Free tier.
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DB_PATH
        value: /var/data/aims.db
      - key: PORT
        value: 10000
    disk:
      name: aims-data
      mountPath: /var/data
      sizeGB: 1
